<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mine opskrifter</title>
<meta name="description" content="Mine egne opskrifter – altid med i lommen">
<meta property="og:title" content="Mine opskrifter">
<meta property="og:description" content="En opskrift er blevet delt med dig 🍲">
<meta name="theme-color" content="#fbf5ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Opskrifter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf5ec; --card:#fffdf9; --ink:#2d2420; --muted:#85766b; --line:#eadfd2;
  --accent:#c2562d; --accent-soft:#f6dccd; --gold:#e9a23b; --accent-ink:#ffffff;
  --chip:#f4e7d8; --danger:#b3261e; --ph1:#f8dcbc; --ph2:#efb48b;
  --shadow:0 1px 3px rgba(80,50,20,.06),0 8px 22px rgba(80,50,20,.08);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191513; --card:#241e1a; --ink:#f4ece4; --muted:#ab9c90; --line:#382f29;
    --accent:#e5784b; --accent-soft:#4a2d20; --gold:#f0b453; --accent-ink:#1a1411;
    --chip:#2f251e; --danger:#ff8a80; --ph1:#4a3424; --ph2:#64402a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{--maxw:760px;margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);
  padding-bottom:calc(100px + env(safe-area-inset-bottom))}
body.v-list,body.v-detail,body.v-shared{--maxw:1100px}
button{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:650;letter-spacing:-.01em}

/* header */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.bar{display:flex;align-items:center;gap:6px;max-width:var(--maxw);margin:0 auto;min-height:40px}
.bar h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.v-list .bar h1{font-size:30px;line-height:1.1}
.sub{max-width:var(--maxw);margin:2px auto 0;color:var(--muted);font-size:15px}
.icon{background:none;border:0;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon:active{background:var(--chip)}
.icon svg{width:24px;height:24px}
.searchwrap{max-width:var(--maxw);margin:12px auto 0;position:relative}
.searchwrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
#search{width:100%;font:inherit;font-size:16px;padding:13px 14px 13px 44px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none;box-shadow:var(--shadow)}
#search:focus{border-color:var(--accent)}
main{max-width:calc(var(--maxw) + 32px);margin:0 auto;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}

/* banner */
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--accent),#d9773f);color:#fff;
  border-radius:18px;padding:12px 12px 12px 14px;margin:6px 0 14px;box-shadow:var(--shadow)}
.banner .bi{font-size:26px}
.banner .bt{flex:1;line-height:1.3;font-size:14px}
.banner .bt b{display:block;font-size:15px}
.banner .btn{background:#fff;color:#a8431f;border:0;padding:8px 14px}
.banner .bx{background:none;border:0;color:#fff;opacity:.8;font-size:16px;padding:4px 6px;cursor:pointer}

/* kategorier */
.cats{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
@media (hover:hover) and (pointer:fine), (min-width:760px){
  .cats{flex-wrap:wrap;overflow:visible;margin:4px 0 12px;padding:2px 0 6px}
}
.cat{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;
  font-weight:600;font-size:14px;white-space:nowrap}
.cat:hover{border-color:var(--accent)}
.cat.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.ghost{color:var(--muted)}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:0 2px 10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0;white-space:nowrap}

/* opskriftskort */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px}
@media (min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}}
.rcard{display:block;background:var(--card);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;
  box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .15s}
.rcard:active{transform:scale(.98)}
.rimg{aspect-ratio:4/3;background:linear-gradient(135deg,var(--ph1),var(--ph2));display:grid;place-items:center;font-size:44px;position:relative;overflow:hidden}
.rimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.badge{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px}
.rbody{padding:10px 12px 12px}
.rt{font-family:var(--serif);font-weight:650;font-size:17px;line-height:1.2}
.rm{color:var(--muted);font-size:13px;margin-top:4px}
.hint{font-size:12.5px;margin-top:4px;color:var(--accent);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .big{font-size:56px;line-height:1}
.empty h3{color:var(--ink);font-size:22px;margin:12px 0 4px}

#fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));height:58px;padding:0 22px 0 18px;border-radius:999px;
  border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 22px rgba(194,86,45,.4);cursor:pointer;z-index:20}
#fab span{font-size:28px;line-height:1;margin-top:-3px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;text-decoration:none;color:inherit}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.add{background:none;border:1px dashed var(--line);color:var(--muted)}
.chip.cat-c{background:var(--accent-soft);font-weight:600}
span.chip{cursor:default}

/* opskrift */
.hero{margin:0 -16px;height:min(34vh,380px);overflow:hidden;background:linear-gradient(135deg,var(--ph1),var(--ph2))}
.hero img{width:100%;height:100%;display:block;object-fit:cover;cursor:zoom-in}
.dcard{position:relative}
.dcard.over{margin:-30px -16px 0;padding:20px 16px 0;background:var(--bg);border-radius:26px 26px 0 0}
.detail h2{font-size:30px;line-height:1.15;margin:6px 0 6px}
.meta{color:var(--muted);font-size:15px;display:flex;gap:14px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.pill.on{background:var(--gold);color:#2d2420;border-color:var(--gold)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pill.on .sw{background:#2d2420}
.pill.on .sw::after{left:16px}
.sharetop{background:var(--accent-soft);border-radius:18px;padding:12px 14px;margin:6px 0 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sharetop .st{flex:1;min-width:180px;line-height:1.35}
.sharetop .st b{display:block}
section{margin-top:26px}
section>h3{font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:8px}
section>h3 small{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted)}
.ings{list-style:none;margin:0;padding:0;background:var(--card);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.ings li{padding:12px 14px 12px 46px;border-top:1px solid var(--line);position:relative;cursor:pointer;user-select:none}
.ings li:first-child{border-top:0}
.ings li::before{content:"";position:absolute;left:15px;top:15px;width:18px;height:18px;border-radius:6px;border:2px solid var(--line);transition:.15s}
.ings li.done{color:var(--muted);text-decoration:line-through}
.ings li.done::before{background:var(--accent);border-color:var(--accent)}
.ings li.sub{font-weight:700;padding-left:14px;cursor:default;background:var(--chip);font-size:14px}
.ings li.sub::before{display:none}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 46px;min-height:34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:15px}
.notes{white-space:pre-wrap;background:var(--chip);border-radius:18px;padding:14px 16px;border-left:4px solid var(--gold)}
.origs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.og{border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;aspect-ratio:3/4;background:var(--chip);cursor:zoom-in}
.og img{width:100%;height:100%;object-fit:cover;display:block}
.part{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;color:inherit;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.th{width:52px;height:52px;border-radius:12px;flex:none;background:linear-gradient(135deg,var(--ph1),var(--ph2));display:grid;place-items:center;font-size:24px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.pt{flex:1;min-width:0;font-weight:700;line-height:1.25}
.pt small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.go{color:var(--muted);font-size:24px}
.part details{border-top:1px solid var(--line)}
.part summary{padding:10px 14px;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;list-style:none}
.part summary::-webkit-details-marker{display:none}
.part summary::before{content:"▸ "}
.part details[open] summary::before{content:"▾ "}
.part details .ings{border:0;border-radius:0;border-top:1px solid var(--line)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:34px;max-width:520px}
.delrow{margin-top:26px;text-align:center}
.linkdel{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px}
.linkdel:hover{color:var(--danger)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.6}

/* bred skærm / liggende: to kolonner */
@media (min-width:760px){
  .hero{margin:0;border-radius:24px;height:min(40vh,400px)}
  .dcard.over{margin:0;padding:18px 0 0;border-radius:0;background:none}
  .cols{display:grid;grid-template-columns:minmax(260px,2fr) 3fr;gap:36px;align-items:start}
  .cols.one{display:block}
}
@media (orientation:landscape) and (max-height:540px){
  header{position:relative}
  #hsub{display:none!important}
  body.v-list .bar h1{font-size:24px}
  .hero{height:48vh}
}

/* formular */
.form label{display:block;font-size:14px;font-weight:700;margin:20px 0 6px}
.form .help{font-weight:400;color:var(--muted)}
.form input[type=text],.form textarea,.sinput{
  width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);outline:none}
.form textarea{min-height:150px;resize:vertical}
.form input:focus,.form textarea:focus,.sinput:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:10px}
.imgrow{display:flex;gap:8px;flex-wrap:wrap}
.box>div:not(:empty)+.imgrow{margin-top:10px}
.imgrow .btn{flex:1;min-width:130px;padding:10px;font-weight:600}
.ph{position:relative;border-radius:12px;overflow:hidden;background:var(--chip)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.rm-x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;cursor:pointer}
.dishph{aspect-ratio:4/3;max-height:340px}
.origgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.origgrid .ph{aspect-ratio:3/4}
.partlist .prow{padding:6px 4px;cursor:default}
.partlist .x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:none}
.savebar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:var(--bg);margin-top:20px}
.savebar .btn{flex:1}

/* login */
.login{max-width:380px;margin:6vh auto 0;text-align:center}
.login img{width:96px;height:96px;border-radius:24px;box-shadow:var(--shadow)}
.login h2{font-size:34px;margin:16px 0 4px}
.gbtn{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:14px 24px;font-size:16px}

/* bundpanel */
#sheet{position:fixed;inset:0;z-index:40}
#sheet .bg{position:absolute;inset:0;background:rgba(20,12,8,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);
  border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto;
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh{font-size:22px;margin:6px 0 12px}
.sh2{font-size:17px;margin:22px 0 8px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt .oi{font-size:24px;width:32px;text-align:center;flex:none}
.opt b{display:block}
.opt small{color:var(--muted);font-size:13px}
.catrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow .emo{font-size:22px;background:var(--chip);border:0;border-radius:12px;width:42px;height:42px;cursor:pointer;flex:none}
.catrow .nm{flex:1;font-weight:700;min-width:0}
.catrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.catrow .icon{width:36px;height:36px;font-size:16px}
.catadd{display:flex;gap:8px;margin-top:12px}
.catadd input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.catadd .e{width:56px;text-align:center}
.catadd .n{flex:1}
.plist{display:grid;gap:4px;margin-top:10px}
.plist .prow{border-radius:14px}
.plist .prow:active{background:var(--chip)}
.plus{color:var(--accent);font-size:22px;font-weight:700}
.howto{padding-left:22px;margin:0 0 16px}
.howto li{margin-bottom:12px}
.howto svg{width:20px;height:20px;vertical-align:-4px;color:var(--accent)}
.muted{color:var(--muted)}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* overlays */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;overflow:auto;display:flex;align-items:center;justify-content:center}
#lightbox img{max-width:100%;max-height:100%}
#lightbox .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55;display:grid;place-items:center;color:#fff;font-weight:700}
[hidden]{display:none!important}

/* udskrift / PDF */
#print{display:none}
@media print{
  @page{margin:15mm}
  html,body{background:#fff!important;color:#111!important}
  body{padding:0!important}
  body>*:not(#print){display:none!important}
  #print{display:block;font:11pt/1.5 Georgia,"Times New Roman",serif;color:#111}
  .prec{break-after:page;page-break-after:always}
  .prec:last-child{break-after:auto;page-break-after:auto}
  .prec h1{font-size:24pt;margin:0 0 4pt;line-height:1.15}
  .prec h2{font-size:12.5pt;margin:12pt 0 4pt;padding-bottom:2pt;border-bottom:1pt solid #ccc}
  .pmeta{color:#555;font-size:10pt;margin:0 0 8pt}
  .pimg{float:right;width:6.5cm;height:4.8cm;object-fit:cover;border-radius:6pt;margin:0 0 8pt 14pt}
  .pcols{display:grid;grid-template-columns:1fr 1.6fr;gap:16pt;clear:both}
  .prec ul{padding-left:14pt;margin:0}
  .prec li{margin:0 0 2pt}
  .prec li.psub{list-style:none;margin:6pt 0 2pt -14pt;font-weight:bold}
  .prec ol{padding-left:16pt;margin:0}
  .prec ol li{margin-bottom:5pt}
  .pnotes{border-left:3pt solid #e9a23b;padding-left:8pt;font-style:italic;white-space:pre-wrap}
  .pcover{padding-top:30mm}
  .pcover h1{font-size:34pt}
  .toc{columns:2;font-size:12pt;margin-top:20pt}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button id="back" class="icon" aria-label="Tilbage" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="htitle">Mine opskrifter</h1>

/* ---------- billeder ---------- */
function loadImg(src){
  return new Promise((res, rej) => {
    const isBlob = src instanceof Blob;
    const url = isBlob ? URL.createObjectURL(src) : src;
    const img = new Image();
    img.onload = () => { if (isBlob) URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { if (isBlob) URL.revokeObjectURL(url); rej(new Error('Kunne ikke læse billedet')); };
    img.src = url;
  });
}
function draw(img, max, q){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * s));
  c.height = Math.max(1, Math.round(img.naturalHeight * s));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
// Komprimerer så billedet passer i ét Firestore-dokument (< 1 MB)
async function compress(src, max, q = .85, limit = 900000){
  const img = await loadImg(src);
  let m = max, out = draw(img, m, q);
  while (out.length > limit && (q > .5 || m > 300)) {
    if (q > .5) q -= .1; else m = Math.round(m * .8);
    out = draw(img, m, q);
  }
  return out;
}
async function loadImage(rid, iid){
  if (!iid || !rid || !user) return null;
  if (imgCache.has(iid)) return imgCache.get(iid);

    const d = s.data()?.data || null;
    if (d) imgCache.set(iid, d);
    return d;
  } catch (e) { return null; }
}

}

  try { localStorage.setItem('draft', JSON.stringify(d)); }
  catch (e) {

/* ---------- router ---------- */
function resetEdit(){ editBuiltFor = null; editRoute = null; ed = null; }
function render(){
  const h = route();
  let m;
  if ((m = h.match(/^#\/s\/(.+)$/))) { resetEdit(); chrome('shared', 'Delt opskrift'); return renderShared(m[1]); }
  if (!authReady) { chrome('login'); app.innerHTML = '<p class="muted">Indlæser…</p>'; return; }
  if (!user) { resetEdit(); chrome('login'); return renderLogin(); }
  if (h === '#/new') { chrome('edit', 'Ny opskrift'); if (editBuiltFor !== h) renderEdit(null); return; }
  if ((m = h.match(/^#\/(edit|copy)\/(.+)$/))) {
    chrome('edit', m[1] === 'copy' ? 'Kopi af opskrift' : 'Rediger opskrift');
    const r = find(m[2]);
    if (!r) { app.innerHTML = loaded ? '<p class="muted">Opskriften findes ikke.</p>' : '<p class="muted">Indlæser…</p>'; return; }
    if (editBuiltFor !== h) m[1] === 'copy' ? startCopy(r) : renderEdit(r);
    return;

const G_SVG = '<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
async function googleLogin(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(auth, provider); return true; }
  catch (err) {
    const c = err.code || '';
    if (c.includes('popup-blocked') || c.includes('operation-not-supported')) {
      try { await signInWithRedirect(auth, provider); } catch (e2) { toast(authErr(e2)); }
    } else if (!c.includes('popup-closed') && !c.includes('cancelled-popup')) toast(authErr(err));
    return false;
  }
}
function renderLogin(){
  app.innerHTML = `<div class="login">
    <img src="icons/icon-192.png" alt="">
    <h2>Mine opskrifter</h2>
    <p class="muted">Alle dine opskrifter samlet ét sted –<br>altid med i lommen.</p>
    <button class="btn gbtn" id="gbtn">${G_SVG} Log ind med Google</button>
    ${isStandalone() ? '' : '<p style="margin-top:26px"><button class="btn sm" id="linst">📲 Læg appen på hjemmeskærmen</button></p>'}
  </div>`;
  const li = $('#linst'); if (li) li.onclick = install;
  $('#gbtn').onclick = async () => {
    $('#gbtn').disabled = true;
    await googleLogin();
    const b = $('#gbtn'); if (b) b.disabled = false;
  };
}
function authErr(e){
  const c = e.code || '';
  if (c.includes('network')) return 'Ingen forbindelse';
  if (c.includes('unauthorized-domain')) return 'Domænet er ikke godkendt i Firebase (Authentication → Settings → Authorized domains)';
  if (c.includes('operation-not-allowed')) return 'Slå Google til under Authentication → Sign-in method i Firebase';
  return e.message || 'Noget gik galt';
}

/* ---------- forside: kategorier + søgning ---------- */
function renderList(){
  const terms = norm(searchEl.value.trim()).split(/\s+/).filter(Boolean);
  if (activeCat && categories.length && !categories.some(c => c.name === activeCat)) { activeCat = null; lsSet('activeCat', null); }
  const pool = activeCat ? recipes.filter(r => (r.categories || []).includes(activeCat)) : recipes;
  const res = [];
  for (const r of pool) {
    if (!terms.length) { res.push({ r }); continue; }
    const parts = (r.parts || []).map(find).filter(Boolean);
    const f = {
      title: norm(r.title), tags: norm([...(r.tags || []), ...(r.categories || [])].join(' ')), ing: norm(r.ingredients),
      steps: norm(r.steps), notes: norm(r.notes), src: norm(r.source), extra: norm([r.servings, r.time].join(' ')),
      parts: norm(parts.map(p => p.title + '\n' + p.ingredients).join('\n'))
    };
    const all = Object.values(f).join('\n');
    if (!terms.every(t => all.includes(t))) continue;
    let score = 0;
    for (const t of terms) { if (f.title.includes(t)) score += 10; if (f.tags.includes(t)) score += 5; if (f.ing.includes(t)) score += 3; if (f.parts.includes(t)) score += 1; }
    let hint = '';
    if (!terms.every(t => f.title.includes(t))) {
      const il = lines(r.ingredients).filter(l => terms.some(t => norm(l).includes(t)));
      const pp = parts.filter(p => terms.some(t => norm(p.title + '\n' + p.ingredients).includes(t)));
      if (il.length) hint = il.slice(0, 2).join(' · ');
      else if (pp.length) hint = 'via ' + pp.map(p => p.title).join(', ');
      else if (terms.some(t => f.steps.includes(t))) hint = 'i fremgangsmåden';
      else if (terms.some(t => f.notes.includes(t))) hint = 'i noterne';
    }
    res.push({ r, score, hint });
  }
  if (terms.length) res.sort((a, b) => b.score - a.score);

  const banner = showBanner() ? `<div class="banner"><div class="bi">📲</div>
    <div class="bt"><b>Få appen på din telefon</b>Læg Mine opskrifter på hjemmeskærmen</div>
    <button class="btn sm" id="bInst">Tilføj</button><button class="bx" id="bX" aria-label="Luk">✕</button></div>` : '';
  const cats = `<div class="cats">
    <button class="cat ${!activeCat ? 'on' : ''}" data-c="">Alle</button>
    ${categories.map(c => `<button class="cat ${activeCat === c.name ? 'on' : ''}" data-c="${esc(c.name)}">${c.emoji} ${esc(c.name)}</button>`).join('')}
    <button class="cat ghost" id="editcats">✏️ Kategorier</button></div>`;

  let body;
  if (!recipes.length) {
    body = loaded
      ? `<div class="empty"><div class="big">🧑‍🍳</div><h3>Din kogebog er tom</h3><p>Tryk på <b>Ny opskrift</b> for at tilføje din første.</p></div>`
      : '<p class="muted">Indlæser…</p>';
  } else if (!res.length) {
    body = `<div class="empty"><div class="big">🔍</div><h3>Intet fundet</h3><p>${terms.length ? 'Ingen opskrifter matcher din søgning' : 'Der er ingen opskrifter i denne kategori endnu'}.</p></div>`;
  } else {
    body = `<div class="listhead"><span>${plural(res.length, 'opskrift', 'opskrifter')}${activeCat ? ' i ' + esc(activeCat) : ''}</span>
        <button class="linkbtn" id="exp">⬇︎ Eksportér${activeCat ? ' kategori' : ''}</button></div>
      <div class="grid">${res.map(({ r, hint }) => {
        const meta = [r.time && '⏱ ' + esc(r.time), (r.categories || []).map(esc).join(', ')].filter(Boolean).join(' · ');
        return `<a class="rcard" href="#/r/${r.id}">
          <div class="rimg">${r.thumb ? `<img src="${r.thumb}" alt="" loading="lazy">` : catEmoji(r)}
            ${(r.parts || []).length ? `<span class="badge">🔗 ${r.parts.length}</span>` : ''}</div>
          <div class="rbody">
            <div class="rt">${esc(r.title)}</div>
            ${meta ? `<div class="rm">${meta}</div>` : ''}
            ${hint ? `<div class="hint">🔎 ${esc(hint)}</div>` : ''}
          </div>
        </a>`; }).join('')}</div>`;
  }
  app.innerHTML = banner + cats + body;

  app.querySelectorAll('.cat[data-c]').forEach(b => b.onclick = () => {
    activeCat = b.dataset.c || null; lsSet('activeCat', activeCat); renderList();
  });
  $('#editcats').onclick = openSettings;
  const ex = $('#exp'); if (ex) ex.onclick = () => openExportSheet(res.map(x => x.r), activeCat || (terms.length ? 'Søgeresultat' : 'Alle opskrifter'));
  const bi = $('#bInst'); if (bi) bi.onclick = install;
  const bx = $('#bX'); if (bx) bx.onclick = () => { lsSet('installDismissed', '1'); renderList(); };
}

/* ---------- indstillinger + kategorier ---------- */
async function saveCats(list){
  categories = list;
  try { await w(setDoc(setRef(), { categories: list }, { merge: true })); }
  catch (e) { toast('Kunne ikke gemme kategorier: ' + e.message); }
}
async function rewriteRecipeCats(fn){
  const b = writeBatch(db); let n = 0;
  for (const r of recipes) {
    const old = r.categories || [];
    const nu = fn(old);
    if (nu.join('\u0001') !== old.join('\u0001')) { b.update(doc(recCol(), r.id), { categories: nu }); n++; }
  }
  if (n) await w(b.commit());
}

      await saveCats(categories.map((c, j) => j === i ? { ...c, emoji: e.trim() } : c)); draw();
    });
    bind('[data-up]', b => async () => {
      const i = +b.dataset.up, list = [...categories];
      [list[i - 1], list[i]] = [list[i], list[i - 1]];
      await saveCats(list); draw();
    });
    bind('[data-ren]', b => async () => {
      const i = +b.dataset.ren, old = categories[i].name;
      const nu = (prompt('Nyt navn', old) || '').trim();
      if (!nu || nu === old) return;
      if (categories.some((c, j) => j !== i && norm(c.name) === norm(nu))) return toast('Den kategori findes allerede');
      busy(true);
      try {
        await saveCats(categories.map((c, j) => j === i ? { ...c, name: nu } : c));
        await rewriteRecipeCats(a => a.map(x => x === old ? nu : x));
        if (activeCat === old) { activeCat = nu; lsSet('activeCat', nu); }
      } catch (e) { toast('Fejl: ' + e.message); }
      busy(false); draw();
    });
    bind('[data-del]', b => async () => {
      const i = +b.dataset.del, name = categories[i].name;
      if (!confirm(`Slet kategorien "${name}"?\nOpskrifterne bliver ikke slettet.`)) return;
      busy(true, 'Sletter…');
      try {
        await saveCats(categories.filter((_, j) => j !== i));
        await rewriteRecipeCats(a => a.filter(x => x !== name));
        if (activeCat === name) { activeCat = null; lsSet('activeCat', null); }
      } catch (e) { toast('Fejl: ' + e.message); }
      busy(false); draw();
    });
    $('#sExp').onclick = () => openExportSheet(recipes, 'Alle opskrifter');
    $('#sImp').onclick = () => { const i = $('#impfile'); i.value = ''; i.click(); };
    $('#sInst').onclick = install;
    $('#sOut').onclick = () => { if (confirm('Log ud?')) { closeSheet(); signOut(auth); } };
  };
  sheetRefresh = draw;
  draw();
}

/* ---------- fælles visning af en opskrift ---------- */
function ingListHtml(arr, pre, chk){
  return `<ul class="ings">${arr.map((l, i) => isSub(l)
    ? `<li class="sub">${esc(l)}</li>`
    : `<li data-k="${pre}:${i}" class="${chk.has(pre + ':' + i) ? 'done' : ''}">${esc(l)}</li>`).join('')}</ul>`;
}
const stepsHtml = arr => `<ol class="steps">${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
function partHtml(p, pid, chk, href){
  const pl = lines(p.ingredients), ps = lines(p.steps);
  const head = `${thumbHtml(p)}<span class="pt">${esc(p.title)}<small>${nIng(pl)} ingredienser${href ? ' · tryk for hele opskriften' : ''}</small></span>`;
  const showSteps = !href && ps.length;
  return `<div class="part">
    ${href ? `<a class="prow" href="${href}">${head}<span class="go">›</span></a>` : `<div class="prow" style="cursor:default">${head}</div>`}
    ${pl.length || showSteps ? `<details><summary>${showSteps ? 'Vis ingredienser og fremgangsmåde' : 'Vis ingredienser'}</summary>
      ${pl.length ? ingListHtml(pl, 'p' + pid, chk) : ''}
      ${showSteps ? `<div style="padding:16px 14px 0">${stepsHtml(ps)}</div>` : ''}</details>` : ''}
  </div>`;
}
function recipeHtml(r, o){
  const ings = lines(r.ingredients), steps = lines(r.steps);
  const src = String(r.source || '').trim();
  const srcHtml = /^https?:\/\//i.test(src) ? `<a href="${esc(src)}" target="_blank" rel="noopener">${esc(src)}</a>` : esc(src);
  const colA = (o.parts.length ? `<section><h3>Består af <small>${plural(o.parts.length, 'opskrift', 'opskrifter')}</small></h3>
        ${o.parts.map(p => partHtml(p, p.id || p.key, o.chk, o.partHref ? o.partHref(p) : null)).join('')}</section>` : '')
    + (ings.length ? `<section><h3>${o.parts.length ? 'Derudover' : 'Ingredienser'} <small>${nIng(ings)} stk.</small></h3>${ingListHtml(ings, 'm', o.chk)}</section>` : '');
  const colB = (steps.length ? `<section><h3>Fremgangsmåde</h3>${stepsHtml(steps)}</section>` : '')
    + (r.notes ? `<section><h3>Noter</h3><div class="notes">${esc(r.notes)}</div></section>` : '')
    + (o.extraB || '')
    + (src ? `<section><h3>Kilde</h3><div>${srcHtml}</div></section>` : '');
  const catChip = c => o.own
    ? `<button class="chip cat-c" data-cat="${esc(c)}">${(categories.find(x => x.name === c) || {}).emoji || ''} ${esc(c)}</button>`
    : `<span class="chip cat-c">${esc(c)}</span>`;
  const tagChip = t => o.own ? `<button class="chip" data-tag="${esc(t)}">#${esc(t)}</button>` : `<span class="chip">#${esc(t)}</span>`;
  return `<article class="detail">
    ${o.top || ''}
    <div class="tools">${o.tools}</div>
    ${o.hero ? `<div class="hero"><img id="hero" src="${o.hero}" alt=""></div>` : ''}
    <div class="dcard ${o.hero ? 'over' : ''}">
      ${(r.categories || []).length ? `<div class="chips" style="margin:0">${r.categories.map(catChip).join('')}</div>` : ''}
      <h2>${esc(r.title)}</h2>
      <div class="meta">${[r.servings && '🍽 ' + esc(r.servings), r.time && '⏱ ' + esc(r.time)].filter(Boolean).map(x => `<span>${x}</span>`).join('')}</div>
      ${(r.tags || []).length ? `<div class="chips">${r.tags.map(tagChip).join('')}</div>` : ''}
      <div class="cols ${colA ? '' : 'one'}"><div class="col-a">${colA}</div><div class="col-b">${colB}</div></div>
      ${o.bottom || ''}
    </div>
  </article>`;
}

async function deleteRecipe(r, usedIn){
  const warn = usedIn.length ? `\n\nDen bruges i: ${usedIn.map(u => u.title).join(', ')}` : '';
  if (!confirm(`Slet "${r.title}"? Det kan ikke fortrydes.${warn}`)) return;
  busy(true, 'Sletter…');
  try {
    const ref = doc(recCol(), r.id);
    const ids = [r.dishId, ...(r.originalIds || [])].filter(Boolean);
    await w(Promise.all(ids.map(id => deleteDoc(doc(ref, 'images', id)))));
    if (usedIn.length) {
      const b = writeBatch(db);
      usedIn.forEach(u => b.update(doc(recCol(), u.id), { parts: (u.parts || []).filter(x => x !== r.id) }));
      await w(b.commit());
    }
    if (r.shareId) deleteDoc(doc(db, 'shared', r.shareId)).catch(() => {});
    await w(deleteDoc(ref));
    location.replace('#/');
    toast('Opskriften er slettet');
  } catch (e) { toast('Fejl: ' + e.message); }
  busy(false);
}

/* ---------- del / eksportér ---------- */
function recipeText(r, getPart){
  const out = [r.title.toUpperCase()];
  const meta = [r.servings && 'Portioner: ' + r.servings, r.time && 'Tid: ' + r.time].filter(Boolean).join(' · ');
  if (meta) out.push(meta);
  const ingBlock = (title, txt) => { const ls = lines(txt); if (!ls.length) return; out.push('', title); ls.forEach(l => out.push(isSub(l) ? '\n' + l : '• ' + l)); };
  const stepBlock = (title, txt) => { const ls = lines(txt); if (!ls.length) return; out.push('', title); ls.forEach((l, i) => out.push(`${i + 1}. ${l}`)); };
  const parts = (r.parts || []).map(getPart).filter(Boolean);
  parts.forEach(p => { ingBlock(`${p.title} – ingredienser:`, p.ingredients); stepBlock(`${p.title} – fremgangsmåde:`, p.steps); });
  ingBlock(parts.length ? 'Derudover:' : 'Ingredienser:', r.ingredients);
  stepBlock('Fremgangsmåde:', r.steps);
  if (r.notes) out.push('', 'Noter:', r.notes);
  if (r.source) out.push('', 'Kilde: ' + r.source);
  return out.join('\n');
}

async function publishShare(r, id){
  const bundle = await buildBundle([r], 'share');
  if (JSON.stringify(bundle).length > 950000) bundle.recipes.forEach(x => { x.dish = null; });
  await w(setDoc(doc(db, 'shared', id), { owner: user.uid, title: r.title, updatedAt: Date.now(), bundle }));
}
async function shareLink(r){
  busy(true, 'Laver link…');
  let id = r.shareId;
  try {
    id = id || doc(collection(db, 'shared')).id;
    await publishShare(r, id);
    if (!r.shareId) { r.shareId = id; await w(setDoc(doc(recCol(), r.id), { shareId: id }, { merge: true })); }
  } catch (e) {
    busy(false);
    const rules = String(e.code || e.message).includes('permission');
    return toast(rules ? 'Deling er ikke slået til – tilføj reglen for "shared" i Firestore' : 'Kunne ikke lave link: ' + e.message);
  }
  busy(false);
  const url = shareUrl(id);
  openSheet(`<h3 class="sh">Linket er klar 🎉</h3>
    <p class="muted" style="margin-top:-6px">Alle med linket kan se opskriften og gemme den i deres egne opskrifter. Retter du opskriften, opdateres linket automatisk.</p>
    <input class="sinput" readonly value="${esc(url)}" id="slink" onfocus="this.select()">
    <div class="opts" style="margin-top:12px">
      ${navigator.share ? `<button class="btn primary" id="sNow">💬 Send via Messenger eller andre apps</button>` : ''}
      <button class="btn ${navigator.share ? '' : 'primary'}" id="sCopy">📋 Kopiér link</button>
    </div>
    <div class="delrow" style="margin-top:14px"><button class="linkdel" id="sStop">Stop deling (linket holder op med at virke)</button></div>`);
  if (navigator.share) $('#sNow').onclick = () => navigator.share({ title: r.title, text: `${r.title} 🍲`, url }).then(closeSheet).catch(() => {});
  $('#sCopy').onclick = async () => { if (await copyText(url)) toast('Link kopieret – indsæt det i Messenger'); };
  $('#sStop').onclick = async () => {
    if (!confirm('Stop deling? Linket holder op med at virke.')) return;

// Pakker opskrifter (inkl. de opskrifter de består af) til én samlet pakke
async function buildBundle(mainList, mode){
  const seen = new Map();
  const add = r => { if (!r || seen.has(r.id)) return; seen.set(r.id, r); (r.parts || []).forEach(id => add(find(id))); };
  mainList.forEach(add);
  const mainIds = new Set(mainList.map(r => r.id));
  const out = [];
  for (const r of seen.values()) {
    let dish = null; const originals = [];
    if (mode === 'file') {
      if (r.dishId) dish = await loadImage(r.id, r.dishId);
      for (const id of r.originalIds || []) { const d = await loadImage(r.id, id); if (d) originals.push(d); }
    } else if (mainIds.has(r.id) && r.dishId) {
      const d = await loadImage(r.id, r.dishId);
      if (d) dish = await compress(d, 1100, .8, 420000);
    }
    out.push({
      key: r.id, title: r.title || '', categories: r.categories || [], parts: r.parts || [],
      ingredients: r.ingredients || '', steps: r.steps || '', servings: r.servings || '', time: r.time || '',
      tags: r.tags || [], source: r.source || '', notes: r.notes || '', thumb: r.thumb || null, dish, originals
    });
  }
  const used = new Set(out.flatMap(x => x.categories));
  return { app: 'mine-opskrifter', v: 1, exportedAt: new Date().toISOString(), main: [...mainIds],
           categories: categories.filter(c => used.has(c.name)), recipes: out };
}
async function exportFile(list, title){
  busy(true, 'Pakker opskrifter…');
  try {
    const bundle = await buildBundle(list, 'file');
    const name = fileName(title);
    const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    toast('Filen er gemt 💾');
  } catch (e) { toast('Kunne ikke eksportere: ' + e.message); }
  busy(false);
}

function printRecipes(list, title){
  const ingP = (t, txt) => { const ls = lines(txt); return ls.length ? `<h2>${esc(t)}</h2><ul>${ls.map(l => isSub(l) ? `<li class="psub">${esc(l)}</li>` : `<li>${esc(l)}</li>`).join('')}</ul>` : ''; };
  const stepP = (t, txt) => { const ls = lines(txt); return ls.length ? `<h2>${esc(t)}</h2><ol>${ls.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : ''; };
  const one = r => {
    const parts = (r.parts || []).map(find).filter(Boolean);
    const meta = [(r.categories || []).join(', '), r.servings && 'Portioner: ' + r.servings, r.time && 'Tid: ' + r.time].filter(Boolean).join('  ·  ');
    const a = parts.map(p => ingP(p.title, p.ingredients)).join('') + ingP(parts.length ? 'Derudover' : 'Ingredienser', r.ingredients);
    const b = parts.map(p => stepP('Fremgangsmåde – ' + p.title, p.steps)).join('') + stepP('Fremgangsmåde', r.steps);
    return `<section class="prec">${r.thumb ? `<img class="pimg" src="${r.thumb}" alt="">` : ''}
      <h1>${esc(r.title)}</h1>${meta ? `<p class="pmeta">${esc(meta)}</p>` : ''}
      <div class="pcols"><div>${a}</div><div>${b}</div></div>
      ${r.notes ? `<h2>Noter</h2><p class="pnotes">${esc(r.notes)}</p>` : ''}
      ${r.source ? `<p class="pmeta">Kilde: ${esc(r.source)}</p>` : ''}</section>`;
  };
  const cover = list.length > 1 ? `<section class="prec pcover"><h1>${esc(title)}</h1>
      <p class="pmeta">${plural(list.length, 'opskrift', 'opskrifter')} · Mine opskrifter</p>
      <ol class="toc">${list.map(r => `<li>${esc(r.title)}</li>`).join('')}</ol></section>` : '';
  $('#print').innerHTML = cover + list.map(one).join('');
  const prevTitle = document.title;
  document.title = title;   // bliver filnavnet, når man gemmer som PDF
  setTimeout(() => { window.print(); }, 300);
  const done = () => { document.title = prevTitle; $('#print').innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
}

/* ---------- import ---------- */
async function importBundle(bundle){
  if (!bundle || bundle.app !== 'mine-opskrifter' || !Array.isArray(bundle.recipes)) throw new Error('Filen er ikke fra Mine opskrifter');
  const map = {}; const toWrite = [];
  for (const x of bundle.recipes) {
    const dup = recipes.find(r => norm(r.title) === norm(x.title) && norm(r.ingredients) === norm(x.ingredients) && norm(r.steps) === norm(x.steps));
    if (dup) { map[x.key] = dup.id; continue; }
    map[x.key] = doc(recCol()).id; toWrite.push(x);
  }
  // kategorier: brug eksisterende navne, tilføj nye
  const catName = n => (categories.find(c => norm(c.name) === norm(n)) || {}).name;
  const newCats = [];
  for (const x of toWrite) for (const n of x.categories || []) {
    if (!catName(n) && !newCats.some(c => norm(c.name) === norm(n))) {
      newCats.push({ name: n, emoji: ((bundle.categories || []).find(c => norm(c.name) === norm(n)) || {}).emoji || '🍴' });
    }
  }
  if (newCats.length) await saveCats([...categories, ...newCats]);
  for (const x of toWrite) {
    const ref = doc(recCol(), map[x.key]);
    const put = async (data, kind) => {
      const iref = doc(collection(ref, 'images'));
      await w(setDoc(iref, { data, kind, createdAt: Date.now() }));
      imgCache.set(iref.id, data);
      return iref.id;
    };
    const dishId = x.dish ? await put(x.dish, 'dish') : null;
    const originalIds = [];
    for (const o of x.originals || []) originalIds.push(await put(o, 'original'));
    let thumb = x.thumb || null;
    if (!thumb && (x.dish || (x.originals || [])[0])) thumb = await compress(x.dish || x.originals[0], 420, .72, 80000);
    await w(setDoc(ref, {
      title: x.title || 'Uden navn', categories: (x.categories || []).map(n => catName(n) || n),
      parts: (x.parts || []).map(k => map[k]).filter(Boolean),
      ingredients: x.ingredients || '', steps: x.steps || '', servings: x.servings || '', time: x.time || '',
      tags: x.tags || [], source: x.source || '', notes: x.notes || '',
      dishId, originalIds, thumb, shareId: null, createdAt: Date.now(), updatedAt: Date.now()
    }));
  }
  return { map, added: toWrite.length, skipped: bundle.recipes.length - toWrite.length };
}

    + `<button type="button" class="chip add" id="newcat">＋ Ny kategori</button>`;
  box.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    const n = b.dataset.cat;
    ed.cats = ed.cats.includes(n) ? ed.cats.filter(x => x !== n) : [...ed.cats, n];

      imgCache.set(iref.id, img.data);

    };
    const dishId = ed.dish ? await put(ed.dish, 'dish') : null;
    const originalIds = [];
    for (const o of ed.originals) originalIds.push(await put(o, 'original'));

    let thumb = null;
    const ts = ed.dish || ed.originals[0];
    if (ts) {
      const d = ts.data || imgCache.get(ts.id) || await loadImage(ref.id, ts.id);
      if (d) thumb = await compress(d, 420, .72, 80000);
    }
    const data = {
      title,
      categories: ed.cats,
      parts: ed.parts,
      ingredients: $('#fi').value.trim(),
      steps: $('#fs').value.trim(),
      servings: $('#fp').value.trim(),
      time: $('#fz').value.trim(),
      tags: $('#fg').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean),
      source: $('#fq').value.trim(),
      notes: $('#fn').value.trim(),
      dishId, originalIds, thumb,
      shareId: r?.shareId || null,
      createdAt: r?.createdAt || Date.now(),
      updatedAt: Date.now()
    };
    await w(setDoc(ref, data));
    for (const id of ed.removed) { w(deleteDoc(doc(ref, 'images', id))).catch(() => {}); imgCache.delete(id); }
    // Er opskriften delt, opdateres linket med det samme
    if (data.shareId) publishShare({ id: ref.id, ...data }, data.shareId).catch(() => {});
    clearDraft();
    editRoute = null; editBuiltFor = null;
    location.replace('#/r/' + ref.id);
    toast(navigator.onLine ? 'Gemt ✓' : 'Gemt – synkroniseres når du er online');
  } catch (e) {
    toast('Kunne ikke gemme: ' + e.message);
  }
  busy(false);
}

/* ---------- start ---------- */
const fb = initializeApp(firebaseConfig);
auth = getAuth(fb);
try {
  db = initializeFirestore(fb, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = initializeFirestore(fb, {});
}
getRedirectResult(auth).catch(err => toast(authErr(err)));
const onEditView = () => !!editRoute && editBuiltFor === route();
onAuthStateChanged(auth, u => {
  user = u; authReady = true; loaded = false; draftChecked = false;
  if (unsub) { unsub(); unsub = null; }
  if (setUnsub) { setUnsub(); setUnsub = null; }
  recipes = []; categories = [];
  if (u) {
    unsub = onSnapshot(recCol(), snap => {
      recipes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.title || '').localeCompare(b.title || '', 'da'));
      loaded = true;
      if (onEditView()) drawParts(); else render();
      if (sheetRefresh) sheetRefresh();
      checkDraft();
    }, err => { loaded = true; toast('Databasefejl: ' + err.message); render(); });
    setUnsub = onSnapshot(setRef(), snap => {
      if (snap.exists()) categories = snap.data().categories || [];
      else if (!snap.metadata.fromCache) { categories = DEFAULT_CATS; setDoc(setRef(), { categories: DEFAULT_CATS }).catch(() => {}); }
      if (onEditView()) drawCats(); else render();
      if (sheetRefresh) sheetRefresh();
    }, () => {});
  }
  render();
});
lastRoute = route();
render();
</script>
</body>
